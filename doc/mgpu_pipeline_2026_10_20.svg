<text x="1070" y="1205" font-size="17" fill="#526279" font-weight="400">+ fence / value</text>
<text x="176" y="1246" font-size="17" fill="#526279" font-weight="400">До перезаписи GPU 1 ждёт sourceReleased. GPU 0 ждёт готовность копии перед чтением.</text>
<line x1="48" y1="1425" x2="1352" y2="1425" stroke="#d7dfe8"/>
<text x="48" y="1468" font-size="22" fill="#457199" font-weight="600">04</text>
<text x="103" y="1468" font-size="26" fill="#20334c" font-weight="600">AO — план вашей команды из полной таблицы</text>
<text x="103" y="1499" font-size="17" fill="#526279" font-weight="400">Гаркуша / Езерский / Климчук · GPU 0 отправляет depth + normals; GPU 1 возвращает AO map перед освещением.</text>
<text x="48" y="1552" font-size="20" fill="#457199" font-weight="600">GPU 0</text>
<rect x="176" y="1515" width="285" height="78" rx="12" fill="#e7f4ee" stroke="#a4ccb8"/>
<text x="192" y="1545" font-size="19" fill="#20334c" font-weight="600">Depth + fill_gbuffer</text>
<text x="192" y="1571" font-size="15" fill="#526279" font-weight="400">Текущий источник нормалей</text>
<rect x="523" y="1515" width="340" height="78" rx="12" fill="#fff2dd" stroke="#e4c98f"/>
<text x="539" y="1545" font-size="19" fill="#20334c" font-weight="600">Подготовка и передача</text>
<text x="539" y="1571" font-size="15" fill="#526279" font-weight="400">R32_FLOAT + R16G16_FLOAT</text>
<rect x="1020" y="1515" width="332" height="78" rx="12" fill="#e7f4ee" stroke="#a4ccb8"/>
