<title id="title">Nau и MGPU — цифровой разбор рисунка</title>
<desc id="desc">Пять схем: учебные зависимости отрисовки, проверенная цепочка Nau, планы переноса теней и AO на GPU 1 и различие AFR, SFR и разделения по проходам.</desc>
