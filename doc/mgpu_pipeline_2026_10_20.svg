<text x="103" y="1083" font-size="26" fill="#20334c" font-weight="600">Перенос теней на GPU 1 — план интеграции</text>
<text x="103" y="1114" font-size="17" fill="#526279" font-weight="400">MG-10 создаёт локальные ресурсы и выполняет draw; межадаптерная передача и включение в кадр — следующий этап.</text>
