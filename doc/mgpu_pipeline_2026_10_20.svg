<text x="1036" y="1571" font-size="15" fill="#526279" font-weight="400">Читает AO map R8_UNORM</text>
<path d="M461,1554 L523,1554" fill="none" stroke="#6e8199" stroke-width="2" marker-end="url(#arrow)" />
<text x="48" y="1697" font-size="20" fill="#457199" font-weight="600">GPU 1</text>
<rect x="523" y="1660" width="340" height="78" rx="12" fill="#e8f0fb" stroke="#abc3df"/>
<text x="539" y="1690" font-size="19" fill="#20334c" font-weight="600">AO pass</text>
<text x="539" y="1716" font-size="15" fill="#526279" font-weight="400">Вход: depth + encoded normal</text>
<rect x="1020" y="1660" width="332" height="78" rx="12" fill="#fff2dd" stroke="#e4c98f"/>
<text x="1036" y="1690" font-size="19" fill="#20334c" font-weight="600">Передача AO → GPU 0</text>
<text x="1036" y="1716" font-size="15" fill="#526279" font-weight="400">Цель: 0 кадров задержки</text>
<path d="M693,1593 L693,1660" fill="none" stroke="#6e8199" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M863,1699 L1020,1699" fill="none" stroke="#6e8199" stroke-width="2" marker-end="url(#arrow)" />
<path d="M1186,1660 L1186,1593" fill="none" stroke="#6e8199" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="176" y="1785" font-size="17" fill="#526279" font-weight="400">Нормали пока не выходят из z-prepass: ранний AO требует изменения prepass, иначе старт после fill_gbuffer.</text>
<text x="176" y="1816" font-size="17" fill="#526279" font-weight="400">1920×1080: 17,80 МиБ полезных данных в обе стороны за кадр. Это расчёт объёма, не замер скорости.</text>
<line x1="48" y1="1885" x2="1352" y2="1885" stroke="#d7dfe8"/>
<text x="48" y="1928" font-size="22" fill="#457199" font-weight="600">05</text>
<text x="103" y="1928" font-size="26" fill="#20334c" font-weight="600">Три способа разделить работу</text>
<text x="103" y="1959" font-size="17" fill="#526279" font-weight="400">Нижний рисунок с shadow map относится к разделению по проходам; его не нужно называть AFR.</text>
<rect x="48" y="1990" width="390" height="115" rx="12" fill="#e8f0fb" stroke="#abc3df"/>
<text x="64" y="2020" font-size="19" fill="#20334c" font-weight="600">AFR — целые кадры</text>
<text x="64" y="2046" font-size="15" fill="#526279" font-weight="400">GPU A: кадры 0, 2   ·   GPU B: 1, 3</text>
<text x="64" y="2083" font-size="15" fill="#526279" font-weight="400">Нужны согласованные данные между кадрами.</text>
<rect x="480" y="1990" width="390" height="115" rx="12" fill="#e8f0fb" stroke="#abc3df"/>
<text x="496" y="2020" font-size="19" fill="#20334c" font-weight="600">SFR — части одного кадра</text>
<text x="496" y="2046" font-size="15" fill="#526279" font-weight="400">Например: левая / правая часть экрана</text>
<text x="496" y="2083" font-size="15" fill="#526279" font-weight="400">Результаты частей нужно объединить.</text>
<rect x="912" y="1990" width="440" height="115" rx="12" fill="#e8f0fb" stroke="#abc3df"/>
<text x="928" y="2020" font-size="19" fill="#20334c" font-weight="600">Разделение по проходам</text>
<text x="928" y="2046" font-size="15" fill="#526279" font-weight="400">GPU 1: AO / тени   ·   GPU 0: остальная сцена</text>
<text x="928" y="2083" font-size="15" fill="#526279" font-weight="400">Нужны передача ресурсов и зависимости.</text>
<text x="48" y="2160" font-size="16" fill="#526279" font-weight="400">Синий: схема/план  ·  зелёный: основной рендер  ·  охра: передача  ·  данные GPU 1 не становятся shared автоматически.</text>
